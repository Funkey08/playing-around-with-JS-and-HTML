<html>

    <head>

        <meta charset="UTF-8" />
        <title>Virtual Library!</title>
        <link rel="stylesheet" href="style.css" />
        <script src="library.js" defer></script>

    </head>

    <body>
        <h1>Virtual Library</h1>
        
        <div class="form-container">
            <form id = "book-form">
                <div class="form-group">
                    <label for="title">Title: </label>
                    <input type="text" id="title" placeholder="Enter book title...">
                </div>
                <div class="form-group">
                    <label for="author">Author: </label>
                    <input type="text" id="author" placeholder="Enter book author...">
                </div>
                <div class="form-group">
                    <label for="pages">Pages: </label>
                    <input type="number" id="pages" placeholder="Enter number of pages...">
                </div>
                <div class="button">
                    <input type="submit" value="Add a book">
                </div>
            </form>
        </div>

        <div id="success-message"></div>
        <div id="failure-message"></div>

        <div class="button"> <button id="view-library-button">Click here to view my library</button> </div>
        <div id="book-list"></div>


    </body>

</html>
